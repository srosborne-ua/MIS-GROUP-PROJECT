# Builds the API (which also serves the site from Client/) and deploys it to Azure App Service
# on every push to main. Needs two settings in the GitHub repo (Settings > Secrets and variables > Actions):
#   Variable AZURE_WEBAPP_NAME             the App Service name, e.g. druid-city-hotel
#   Secret   AZURE_WEBAPP_PUBLISH_PROFILE  contents of the publish profile downloaded from the Azure portal
# ANTHROPIC_API_KEY is set in the App Service's environment variables, never here.
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish API -c Release -o ${{ runner.temp }}/site

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/site
